<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibroDex | Tarjetas con Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container py-5">
      <h2 class="mb-4">Autores destacados</h2>

      <div class="row g-4">
        <div class="col-12 col-md-6 col-xl-3">
          <div class="card h-100 text-center shadow">
            <div class="card-body d-flex flex-column align-items-center gap-2">
              <div
                class="bg-success text-warning border border-warning border-2 rounded d-flex align-items-center justify-content-center fs-4"
                style="width: 72px; height: 72px"
              >
                AD
              </div>
              <h3 class="h5 card-title mb-0">Alexandre Dumas</h3>
              <p class="small text-warning mb-0">Francia · 1802–1870</p>
              <span class="badge text-bg-secondary text-uppercase"
                >18 tomos archivados</span
              >
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-xl-3">
          <div class="card h-100 text-center shadow">
            <div class="card-body d-flex flex-column align-items-center gap-2">
              <div
                class="bg-success text-warning border border-warning border-2 rounded d-flex align-items-center justify-content-center fs-4"
                style="width: 72px; height: 72px"
              >
                JA
              </div>
              <h3 class="h5 card-title mb-0">Jane Austen</h3>
              <p class="small text-warning mb-0">Reino Unido · 1775–1817</p>
              <span class="badge text-bg-secondary text-uppercase"
                >7 obras canónicas</span
              >
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-xl-3">
          <div class="card h-100 text-center shadow">
            <div class="card-body d-flex flex-column align-items-center gap-2">
              <div
                class="bg-success text-warning border border-warning border-2 rounded d-flex align-items-center justify-content-center fs-4"
                style="width: 72px; height: 72px"
              >
                EP
              </div>
              <h3 class="h5 card-title mb-0">Edgar Allan Poe</h3>
              <p class="small text-warning mb-0">Estados Unidos · 1809–1849</p>
              <span class="badge text-bg-secondary text-uppercase"
                >14 cuentos y poemas</span
              >
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-xl-3">
          <div class="card h-100 text-center shadow">
            <div class="card-body d-flex flex-column align-items-center gap-2">
              <div
                class="bg-success text-warning border border-warning border-2 rounded d-flex align-items-center justify-content-center fs-4"
                style="width: 72px; height: 72px"
              >
                MS
              </div>
              <h3 class="h5 card-title mb-0">Mary Shelley</h3>
              <p class="small text-warning mb-0">Reino Unido · 1797–1851</p>
              <span class="badge text-bg-secondary text-uppercase"
                >9 volúmenes</span
              >
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
