<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Registro de nuevos usuarios para LibroDex."
    />
    <meta
      name="author"
      content="Carlos Alonso Meza Meza y Sebastian Nuñez Marquez"
    />
    <title>Registro | LibroDex</title>
  </head>
  <body>
    <header>
      <h1>LibroDex</h1>
      <nav aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="generos.html">Géneros</a></li>
          <li><a href="autores.html">Autores</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Crear una cuenta</h2>

        <form action="registro.php" method="POST" enctype="multipart/form-data">
          <fieldset>
            <legend>Datos de usuario</legend>

            <div>
              <label for="username">Usuario:</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Tu nombre de usuario"
                required
                maxlength="20"
              />
            </div>

            <div>
              <label for="email">Correo electrónico:</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="ejemplo@correo.com"
                required
              />
            </div>

            <div>
              <label for="password">Contraseña:</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                minlength="8"
              />
            </div>

            <div>
              <label for="telefono">Teléfono (opcional):</label>
              <input
                type="tel"
                id="telefono"
                name="telefono"
                placeholder="123-456-7890"
                pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
              />
            </div>

            <div>
              <label for="nacimiento">Fecha de nacimiento:</label>
              <input
                type="date"
                id="nacimiento"
                name="nacimiento"
                max="2010-01-01"
                required
              />
            </div>

            <div>
              <label for="id_usuario">ID de Sistema:</label>
              <input
                type="text"
                id="id_usuario"
                name="id_usuario"
                value="LDX-492"
                readonly
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Perfil de Lector</legend>

            <div>
              <label for="libros_mes">Libros leídos por mes:</label>
              <input
                type="number"
                id="libros_mes"
                name="libros_mes"
                min="0"
                max="50"
                step="1"
                value="1"
              />
            </div>

            <div>
              <label for="blog">Sitio web o Blog literario:</label>
              <input
                type="url"
                id="blog"
                name="blog"
                placeholder="https://midominio.com"
              />
            </div>

            <div>
              <label for="busqueda_perfil"
                >Buscar intereses (Próximamente):</label
              >
              <input
                type="search"
                id="busqueda_perfil"
                name="busqueda_perfil"
                disabled
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Preferencias de lectura</legend>

            <p>Formato preferido:</p>
            <div>
              <input
                type="radio"
                id="formato_fisico"
                name="formato"
                value="fisico"
                checked
              />
              <label for="formato_fisico">Libro Físico</label>
            </div>
            <div>
              <input
                type="radio"
                id="formato_digital"
                name="formato"
                value="digital"
              />
              <label for="formato_digital">Libro Digital</label>
            </div>

            <p>Opciones adicionales:</p>
            <div>
              <input
                type="checkbox"
                id="boletin"
                name="boletin"
                value="suscrito"
              />
              <label for="boletin"
                >Deseo recibir recomendaciones semanales</label
              >
            </div>
          </fieldset>

          <br />
          <button type="submit">Registrarse</button>
        </form>
      </section>
    </main>

    <footer>
      <p>LibroDex Versión 1.0</p>
    </footer>
  </body>
</html>
