<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibroDex | Acceso</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .oculto {
        display: none;
      }
      .error-msg {
        color: #ff6b6b;
        font-size: 0.8rem;
        display: block;
        margin-top: 4px;
      }
    </style>
  </head>
  <body class="oscuro">
    <main class="registro-layout">
      <section class="registro-info">
        <div class="registro-logo">LibroDex</div>
        <p class="etiqueta">Enciclopedia y archivo canónico</p>
        <h1>Descubre el universo <em>infinito</em> de los libros.</h1>
      </section>

      <section class="registro-panel">
        <div class="registro-tabs">
          <button id="btnTabLogin" class="tab activo">Iniciar sesión</button>
          <button id="btnTabRegistro" class="tab">Crear cuenta</button>
        </div>

        <form id="formLogin" novalidate>
          <h2>Bienvenido de nuevo</h2>

          <div class="form-grupo">
            <label for="login-correo">CORREO ELECTRÓNICO</label>
            <input type="email" id="login-correo" name="correo" required />
            <span class="error-msg" id="error-login-correo"></span>
          </div>

          <div class="form-grupo">
            <label for="login-password">CONTRASEÑA</label>
            <input
              type="password"
              id="login-password"
              name="password"
              required
            />
            <span class="error-msg" id="error-login-password"></span>
          </div>

          <button type="submit">ENTRAR →</button>
        </form>

        <form id="formRegistro" class="oculto" novalidate>
          <h2>Únete a LibroDex</h2>

          <div class="form-grupo">
            <label for="reg-nombre">NOMBRE DE USUARIO</label>
            <input type="text" id="reg-nombre" name="nombre" required />
            <span class="error-msg" id="error-reg-nombre"></span>
          </div>

          <div class="form-grupo">
            <label for="reg-correo">CORREO ELECTRÓNICO</label>
            <input type="email" id="reg-correo" name="correo" required />
            <span class="error-msg" id="error-reg-correo"></span>
          </div>

          <div class="form-grupo">
            <label for="reg-password">CONTRASEÑA</label>
            <input type="password" id="reg-password" name="password" required />
            <span class="error-msg" id="error-reg-password"></span>
          </div>

          <button type="submit">REGISTRARSE →</button>
        </form>
      </section>
    </main>

    <script type="module" src="JavaScript/registro.js"></script>
  </body>
</html>
